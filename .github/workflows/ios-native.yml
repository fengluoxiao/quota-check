name: iOS native SwiftUI build (macOS 27)
on:
  push:
    branches: [main]
    paths:
      ["ios-native/**", ".github/workflows/ios-native.yml"]
  pull_request:
    paths: ["ios-native/**", ".github/workflows/ios-native.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: Publish verified native iOS package
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_NATIVE_BUNDLE_IDENTIFIER || 'com.fengluoxiao.quotacheck.native' }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify macOS 27 / Xcode 27
        run: |
          sw_vers
          xcodebuild -version
          test "$(uname -m)" = arm64
          case "$(sw_vers -productVersion)" in 27.*) ;; *) exit 1 ;; esac
      - name: Run Swift protocol tests
        working-directory: ios-native
        run: swift test
      - name: Build and verify iOS simulator app
        working-directory: ios-native
        env:
          IOS_BUILD_MODE: simulator
        run: |
          bash Scripts/build-ios.sh
          bash Scripts/smoke-simulator.sh
      - name: Build unsigned iPhone device package
        working-directory: ios-native
        env:
          IOS_BUILD_MODE: device
        run: bash Scripts/build-ios.sh
      - name: Upload native package, checksums and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quota-check-ios-native-${{ github.run_number }}
          path: |
            ios-native/build/QuotaCheck-ios-unsigned.ipa
            ios-native/build/QuotaCheck-ios-simulator-arm64.app.zip
            ios-native/build/ios-simulator.png
            ios-native/build/native-health.json
            ios-native/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Install required Windows App Runtime
        run: ./scripts/install_windows_runtime.ps1
      - name: Test desktop protocols and encrypted files
        run: python -m unittest discover -s tests -v
      - name: Build Windows x64 EXE
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          python -m PyInstaller --noconfirm --clean --distpath build/windows/dist --workpath build/windows/work GLMQuota.spec *> build/windows/pyinstaller.log
          if ($LASTEXITCODE -ne 0) { Get-Content build/windows/pyinstaller.log -Tail 60; exit $LASTEXITCODE }
      - name: Verify packaged native UI and credential protection for every service
        run: |
          $quotaExe = @(Get-ChildItem -LiteralPath build/windows/dist -Filter '*.exe')
          if ($quotaExe.Count -ne 1) { throw 'Expected one desktop executable' }
          python scripts/check_windows.py $quotaExe[0].FullName build/windows/dist
      - name: Upload Windows package and native reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quota-check-windows-${{ github.run_number }}
          path: build/windows/dist/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    needs: [ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: quota-check-ios-native-${{ github.run_number }}
          path: build/release/ios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: quota-check-windows-${{ github.run_number }}
          path: build/release/windows
      - name: Publish verified native iOS and Windows packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_native_release.py build/release
